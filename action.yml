name: 'notify-telegram-action-flow'
description: 'Sends a Telegram message on build success or failure'
author: 'James-Kua'
branding:
  icon: 'message-circle'
  color: 'blue'
inputs:
  workflow_name:
    description: 'Name of the workflow'
    required: true
    default: 'Build'
  to:
    description: 'Telegram chat ID'
    required: true
  token:
    description: 'Telegram bot token'
    required: true
  changed_files:
    description: 'A custom list of changed files to include in the message'
    required: false
    default: ''
  message_format:
    description: 'Message format for Telegram (markdown or html)'
    required: false
    default: 'markdown'
  disable_preview:
    description: 'Disable web page preview (true/false)'
    required: false
    default: 'true'
  timezone:
    description: 'Timezone for the datetime (e.g. Asia/Singapore)'
    required: false
    default: 'Asia/Singapore'

runs:
  using: "composite"
  steps:
    - name: Format Telegram notification
      id: notification
      shell: bash
      env:
        TZ: ${{ inputs.timezone }}
        MESSAGE_FORMAT: ${{ inputs.message_format }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        WORKFLOW_NAME: ${{ inputs.workflow_name }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        CHANGED_FILES: ${{ inputs.changed_files }}
      run: python3 "$GITHUB_ACTION_PATH/format_notification.py"

    - name: Send telegram on success
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ inputs.to }}
        token: ${{ inputs.token }}
        format: ${{ inputs.message_format }}
        disable_web_page_preview: ${{ inputs.disable_preview }}
        message: |
          ✅ ${{ steps.notification.outputs.workflow }} passed!

          ${{ steps.notification.outputs.body }}

    - name: Send telegram on failure
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ inputs.to }}
        token: ${{ inputs.token }}
        format: ${{ inputs.message_format }}
        disable_web_page_preview: ${{ inputs.disable_preview }}
        message: |
          ❌ ${{ steps.notification.outputs.workflow }} failed!

          ${{ steps.notification.outputs.body }}
